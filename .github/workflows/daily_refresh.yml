# .github/workflows/daily_refresh.yml
# Runs daily at 6 AM UTC — pulls the latest Transfermarkt/Kaggle dataset,
# reprocesses, retrains the model, and pushes updated data.
# FBref stats still require a manual CSV export (see README limitations) —
# this workflow does not touch scrape_fbref.py.

name: Daily Data Refresh

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install kaggle

      - name: Download latest dataset from Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p data/raw
          kaggle datasets download -d davidcariboo/player-scores -f players.csv -p data/raw --unzip --force
          kaggle datasets download -d davidcariboo/player-scores -f player_valuations.csv -p data/raw --unzip --force
          kaggle datasets download -d davidcariboo/player-scores -f appearances.csv -p data/raw --unzip --force

      - name: Load Transfermarkt valuations
        run: python src/scrape_transfermarkt.py

      - name: Aggregate season stats (games played, goals, assists)
        run: python src/aggregate_appearances.py --season 2526

      - name: Preprocess & merge
        run: python src/preprocess.py --season 2526

      - name: Train model & generate predictions
        run: python src/model.py --season 2526

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/players.csv data/raw/player_valuations.csv data/processed/*.csv data/processed/*.json
          git diff --cached --quiet || git commit -m "🔄 Daily data refresh $(date -u +%Y-%m-%d)"
          git push
